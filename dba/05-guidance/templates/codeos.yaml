# Canonical path: .codeos/00-project/codeos.yaml
#
# The single project configuration naming the Platform Baseline, the fixed Codeos Mechanics
# (display only — see dba/02-policies/codeos-mechanics/<version>.md, which owns their semantics),
# and each artifact type's governed state. Checked by
# `bash dba/04-tools/configuration/project-config-contract.sh`.
#
# An artifact type's governed state has exactly one authoritative source: the `artifacts:` block
# below. Never restate it inside an artifact's own frontmatter.

platform:
  persistence: postgresql
  backend: rust
  webapp: svelte
  runtime: docker
  # A tier reads "not-applicable: <reason>" only when the Solution Charter records why it does not
  # apply, e.g.:
  #   webapp: not-applicable: no end user; charter.md records this as a pure backend service

# The fixed `mechanics:` block is written here by `dba-init.sh`, rendered from the Codeos Mechanics
# policy the active DBA configuration selects (see dba/04-tools/configuration/render-mechanics-block.sh).
# It is transparency only — a project cannot change a value; project-config-contract.sh fails closed
# on any deviation from the selected policy's exact set.

artifacts:
  # Charter, intent, contract, and event_schema are locked governed and cannot be set otherwise.
  charter: governed
  intent: governed
  contract: governed
  event_schema: governed
  # Every other type is project-configurable. Values below are the shipped defaults.
  architecture: governed
  module_design_note: nongoverned
  learning_register: nongoverned
  review_file: nongoverned
  feature_decomposition: nongoverned
  project_terminology: nongoverned
  user_workflow_map: nongoverned
  refinement: nongoverned
