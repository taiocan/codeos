[package]
name = "codeos-workflow"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "codeos-workflow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
