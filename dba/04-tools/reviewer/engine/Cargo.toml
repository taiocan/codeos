[package]
name = "codeos-reviewer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "codeos-reviewer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.34"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
