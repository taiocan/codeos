# Feature Registry
#
# Schema version 2 (UPG-0041). If your registry doesn't declare `schema_version: 2`, it
# predates this schema — see docs/registry-v2-migration.md before editing further.
#
# This file is an index, not a truth source. Filesystem, git state, and approved
# DBA artifacts take precedence over any entry here. If this registry disagrees
# with actual state, correct the registry — do not use registry entries to override
# actual artifacts.
#
# Human-maintained. Update whenever a feature advances a stage or changes status.
#
# Recommended downstream instance path: features/registry.yaml
# (Copy this template to features/registry.yaml in your downstream project.)
#
# Status values (lifecycle / decision state — never encodes stage; see current_stage
# below for workflow position; keep the two independent):
#   hypothesized — produced by Onboarding (Session Type D); HYPOTHESIZED_INTENT, not yet
#                  approved as Stage 1 Intent; must pass Stage 1 review to advance
#   active       — currently progressing through the DBA stage loop
#   suspended    — work paused; evidence chain preserved
#   blocked      — blocked by an unresolved dependency or finding
#   complete     — all required stages approved, no open refinements
#
# current_stage values (DBA workflow position — independent of status above):
#   0    — brief / pre-Stage-1
#   1–10 — current DBA stage
#   null — not yet placed in the normal stage flow
#
# reconciliation_status / replay_status values:
#   pending — not yet run
#   passed  — last run passed
#   failed  — last run failed (requires resolution before advancing)
#   na      — not applicable at the current stage
#
# architecture_cohort (optional, additive — schema_version stays 2):
#   null, or the cohort_id of the ONE architecture_cohorts entry below this feature belongs to.
#   A feature belongs to at most one active cohort; a project may declare multiple cohorts, but
#   their feature memberships must not overlap. A feature with architecture_cohort: null (or the
#   field absent entirely — both mean the same thing) has no Stage 4 cohort-eligibility check;
#   this is the default, unaffected state for a registry that predates this field or a feature
#   never part of a cohort. See the architecture_synthesis_policy component selected by
#   .codeos/dba-system.md.
#
# architecture_cohorts[].status values:
#   declared          — cohort membership set is declared; gate not yet started
#   gate-in-progress  — Intent/Contract/Event Cohort Checks and/or synthesis underway (drafting the
#                        Baseline and/or the Cohort Logical Design; neither is approved yet)
#   baseline-approved — compatibility-only landing state: a cohort that reached `approved` under the
#                        pre-two-output-model rule (Baseline only) is reinterpreted as this on first
#                        read after that model changed. A fresh cohort going through the current
#                        4-step pipeline does not pass through this state — see
#                        the architecture_synthesis_policy component selected by
#                        .codeos/dba-system.md.
#   approved          — both Architecture Baseline (baseline_version) and Cohort Logical Design
#                        (logical_design_version) approved; cohort members may begin Stage 4 (subject
#                        to both applicable versions covering them)
#   Stage 4 treats `declared`, `gate-in-progress`, and `baseline-approved` identically — all three
#   block Stage 4 for member features exactly the same way; only `approved` unblocks it.

schema_version: 2

features:
  - feature_id: F-0001           # stable feature identifier — F-#### format, see .codeos/templates/conventions.md → Feature IDs
    slug: example-feature         # required — feature_id is stable identity, slug is the readable label
    description: "Brief description of what this feature does"
    type: F                       # F (feature) | R (refinement of an existing feature)
    status: active                # hypothesized | active | suspended | blocked | complete
    branch: feature/example       # git branch tracking this feature
    current_stage: 1              # 0 | 1–10 | null — see current_stage values above
    intent: null                  # path to approved intent artifact, or null
    contract: null                # path to approved contract artifact, or null
    event_schema: null            # path to approved event schema artifact, or null
    pr: null                      # pull request URL or null
    last_commit: null             # last known commit SHA or null
    reconciliation_status: na     # pending | passed | failed | na
    replay_status: na             # pending | passed | failed | na
    blockers: []                  # structured list of blocking issues; empty if none — see notes below for free-form context
    notes: ""                     # free-form context or next action; does not replace structured blockers above
    # architecture_cohort: null    # OPTIONAL — omitted here deliberately: this example feature is
                                    # not part of any cohort. Uncomment and set to a cohort_id
                                    # below only when this feature is declared into one.

architectural_refinements:
  - refine_id: example_refine
    description: "Brief description of the structural change"
    status: step2  # step1 | step2 | step3 | step4 | step5 | complete
    artifact: refinements/arch/example_refine.md
    notes: ""

# architecture_cohorts: OPTIONAL top-level list — only present when at least one core
# architecture cohort has been declared (see the architecture_synthesis_policy component selected
# by .codeos/dba-system.md).
# Absent entirely for projects with no declared cohort; this is the default and
# does not affect any existing registry.
#
# architecture_cohorts:
#   - cohort_id: example_cohort
#     member_features: [F-0001, F-0002]   # each listed feature's own architecture_cohort field
#                                          # must equal this cohort_id — no feature may appear in
#                                          # more than one cohort's member_features list
#     status: declared                    # declared | gate-in-progress | baseline-approved | approved
#     baseline_version: null              # a single, cohort-level current value — set once status
#                                          # reaches approved (or, for a cohort mid-transition to the
#                                          # two-output model, at baseline-approved), and kept equal
#                                          # to architecture/core-baseline.md's current version at
#                                          # all times. Historical architecture/history/core-baseline-
#                                          # v<version>.md files are provenance records only — a
#                                          # stale (non-current) value here blocks Stage 4 for this
#                                          # cohort's members, it is not an alternate valid value
#                                          # (see the architecture_synthesis_policy component
#                                          # selected by .codeos/dba-system.md →
#                                          # "Verifying a `baseline_version` or
#                                          # `logical_design_version` reference")
#     logical_design_version: null        # a single, cohort-level current value — set once status
#                                          # reaches approved, kept equal to architecture/cohort-
#                                          # logical-design.md's current version at all times, with
#                                          # the same staleness rule as baseline_version above. Stays
#                                          # null while status is declared, gate-in-progress, or
#                                          # baseline-approved — a Logical Design is not yet approved
#                                          # in any of those states.
#     declared_by: ""
#     declared_at: ""
#     # No free-form `notes` field here, deliberately: this registry entry is an index only —
#     # membership, gate status, and version references. Rationale, open questions, and any other
#     # structural context belong in architecture/core-baseline.md or architecture/cohort-logical-
#     # design.md themselves (Open Architectural Risks / Revisit Triggers), never smuggled into the
#     # registry as free text.
