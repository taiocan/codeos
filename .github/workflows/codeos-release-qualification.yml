name: codeos-release-qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new commit on a pull request cancels its superseded run. Every main push and manual run gets
# its own group, so each one runs to completion and a red commit can be identified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt
      - name: Install fast-check dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Fast gate
        run: bash dba/04-tools/tests/gate.sh fast
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
      - name: Install qualification dependencies
        run: npm install --global npm@9.2.0 && cargo install cargo-audit --locked
      - name: Full gate
        run: bash dba/04-tools/tests/gate.sh full
      - name: Committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Qualified release build
        if: github.event_name != 'pull_request'
        run: bash dba/04-tools/release/build-qualified-release.sh
      - name: Verify release binaries
        if: github.event_name != 'pull_request'
        run: |
          bash dba/04-tools/release/verify-qualified-binary.sh codeos-workflow dba/04-tools/workflow/engine/target/release/codeos-workflow
          bash dba/04-tools/release/verify-qualified-binary.sh codeos-reviewer dba/04-tools/reviewer/engine/target/release/codeos-reviewer
