name: codeos-release-qualification

on:
  push:
  pull_request:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt
      - name: Install qualification dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep && npm install --global npm@9.2.0 && cargo install cargo-audit --locked
      - name: Test
        run: bash dba/04-tools/tests/run.sh
      - name: Format
        run: cargo fmt --manifest-path dba/04-tools/workflow/engine/Cargo.toml --check && cargo fmt --manifest-path dba/04-tools/reviewer/engine/Cargo.toml --check
      - name: Static analysis
        run: cargo clippy --manifest-path dba/04-tools/workflow/engine/Cargo.toml --all-targets -- -D warnings && cargo clippy --manifest-path dba/04-tools/reviewer/engine/Cargo.toml --all-targets -- -D warnings
      - name: Dependency vulnerabilities
        run: cargo audit --file dba/04-tools/workflow/engine/Cargo.lock && cargo audit --file dba/04-tools/reviewer/engine/Cargo.lock
      - name: Committed secrets
        uses: gitleaks/gitleaks-action@v2
      - name: Compatibility
        run: bash dba/04-tools/compatibility/run.sh
      - name: Qualified release build
        run: bash dba/04-tools/release/build-qualified-release.sh
      - name: Verify release binaries
        run: |
          bash dba/04-tools/release/verify-qualified-binary.sh codeos-workflow dba/04-tools/workflow/engine/target/release/codeos-workflow
          bash dba/04-tools/release/verify-qualified-binary.sh codeos-reviewer dba/04-tools/reviewer/engine/target/release/codeos-reviewer
